name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "templates/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "./docs/package-lock.json"

      - name: Install pandoc
        run: sudo apt-get install -y pandoc

      - name: Install dependencies
        working-directory: ./docs
        run: npm ci

      - name: Generate Word files for contracts
        run: |
          mkdir -p docs/public/downloads/contracts
          for file in templates/contracts/*.md; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" .md)
              pandoc "$file" -o "docs/public/downloads/contracts/${filename}.docx"
              echo "Generated: ${filename}.docx"
            fi
          done

      - name: Build Astro site
        working-directory: ./docs
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
