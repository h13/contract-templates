name: Build Documents

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'templates/**/*.md'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'templates/**/*.md'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      formats:
        description: 'Output formats (comma-separated: docx,pdf,html)'
        required: false
        default: 'docx,pdf'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pandoc and texlive
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-fonts-extra texlive-lang-cjk fonts-noto-cjk

      - name: Create default template if not exists
        run: |
          mkdir -p dist
          if [ ! -f templates/reference.docx ]; then
            echo "Creating default Word template..."
            pandoc templates/template.md -o templates/reference.docx
          fi

      - name: Build Word documents
        run: |
          echo "Building Word documents..."
          # Build contracts
          for file in templates/contracts/*.md; do
            if [ -f "$file" ]; then
              pandoc "$file" -o "dist/$(basename "${file%.md}.docx")" \
                --reference-doc=templates/reference.docx
              echo "✓ Built: $(basename "${file%.md}.docx")"
            fi
          done
          # Build regulations
          for file in templates/regulations/*.md; do
            if [ -f "$file" ]; then
              pandoc "$file" -o "dist/$(basename "${file%.md}.docx")" \
                --reference-doc=templates/reference.docx
              echo "✓ Built: $(basename "${file%.md}.docx")"
            fi
          done

      - name: Build PDF documents
        run: |
          echo "Building PDF documents..."
          # Build contracts
          for file in templates/contracts/*.md; do
            if [ -f "$file" ]; then
              pandoc "$file" -o "dist/$(basename "${file%.md}.pdf")" \
                --pdf-engine=xelatex \
                -V CJKmainfont="Noto Sans CJK JP"
              echo "✓ Built: $(basename "${file%.md}.pdf")"
            fi
          done
          # Build regulations
          for file in templates/regulations/*.md; do
            if [ -f "$file" ]; then
              pandoc "$file" -o "dist/$(basename "${file%.md}.pdf")" \
                --pdf-engine=xelatex \
                -V CJKmainfont="Noto Sans CJK JP"
              echo "✓ Built: $(basename "${file%.md}.pdf")"
            fi
          done

      - name: Build HTML documents
        run: |
          echo "Building HTML documents..."
          # Build contracts
          for file in templates/contracts/*.md; do
            if [ -f "$file" ]; then
              pandoc "$file" -o "dist/$(basename "${file%.md}.html")" \
                --standalone \
                --metadata title="$(basename "${file%.md}")"
              echo "✓ Built: $(basename "${file%.md}.html")"
            fi
          done
          # Build regulations
          for file in templates/regulations/*.md; do
            if [ -f "$file" ]; then
              pandoc "$file" -o "dist/$(basename "${file%.md}.html")" \
                --standalone \
                --metadata title="$(basename "${file%.md}")"
              echo "✓ Built: $(basename "${file%.md}.html")"
            fi
          done

      - name: Upload documents
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documents
          path: dist/
          retention-days: 30

      - name: Create index
        run: |
          {
            echo "# Generated Documents"
            echo ""
            echo "This directory contains auto-generated documents."
            echo ""
            echo "## Files"
            echo ""
          } > dist/README.md
          for file in dist/*; do
            if [ -f "$file" ] && [ "$(basename "$file")" != "README.md" ]; then
              echo "- $(basename "$file")" >> dist/README.md
            fi
          done

      - name: Commit generated files
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f dist/
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: Update generated documents"
            git push
          fi
